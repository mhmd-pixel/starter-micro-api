org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true

# --- Optoflow app configuration ---------------------------------------------
# Page opened on first launch. Afterwards the app reopens the last clinic
# subdomain the user was on (e.g. https://clinic-name.optoflow.ir/).
optoflow.startUrl=https://optoflow.ir/
# Comma-separated hosts that stay inside the app. Subdomains are included, so
# "optoflow.ir" also covers every clinic-name.optoflow.ir. Everything else
# (and patient portal links under /p/) opens in the browser.
optoflow.allowedHosts=optoflow.ir
# Web route that receives files shared into the app from other apps
# (Telegram, WhatsApp, gallery...). It reads them with OptoflowNative.takeSharedItems().
optoflow.sharePath=/android-share
