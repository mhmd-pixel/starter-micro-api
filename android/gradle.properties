org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true

# --- Optoflow app configuration ---------------------------------------------
# The web app the shell loads on launch. Replace with the real production URL.
optoflow.startUrl=https://app.optoflow.example/
# Comma-separated hosts that stay inside the app (subdomains are included
# automatically, so "optoflow.example" also covers "clinic1.optoflow.example").
# Everything else opens in a browser tab.
optoflow.allowedHosts=optoflow.example
